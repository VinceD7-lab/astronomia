# Publication automatique sur GitHub Pages à chaque push sur la branche main.
# Dans le dépôt : Settings › Pages › Source : « GitHub Actions ».
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Sans domaine propre : https://<utilisateur>.github.io/<depot>/ — déduit du dépôt, rien à régler.
    env:
      SITE: https://${{ github.repository_owner }}.github.io
      BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
